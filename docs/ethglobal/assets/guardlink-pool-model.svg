<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">GuardLink proposed contribution split</title>
  <desc id="description">The proposed allocation sends ninety percent to the claims reserve and ten percent to operating expenses. The testnet contract currently sends the full contribution to the reserve.</desc>
  <rect width="1200" height="420" rx="24" fill="#0d1510"/>
  <g font-family="Arial, sans-serif">
    <text x="64" y="61" font-size="21" font-weight="700" letter-spacing="3" fill="#c7fa68">GUARDLINK · PROPOSED MODEL</text>
    <text x="64" y="123" font-size="46" font-weight="700" fill="#f7f8ee">How contributions would be allocated</text>
    <rect x="64" y="163" width="1072" height="65" rx="11" fill="#376752"/>
    <path d="M75 163h954v65H75a11 11 0 0 1-11-11v-43a11 11 0 0 1 11-11z" fill="#c7fa68"/>
    <text x="92" y="207" font-size="33" font-weight="700" fill="#0d1510">90%</text>
    <text x="1045" y="207" font-size="27" font-weight="700" fill="#fff">10%</text>
    <text x="64" y="281" font-size="26" font-weight="700" fill="#f7f8ee">Claims reserve</text>
    <text x="1136" y="281" text-anchor="end" font-size="26" font-weight="700" fill="#f7f8ee">Operating expenses</text>
    <path d="M64 315h1072" stroke="#395144"/>
    <text x="64" y="365" font-size="22" fill="#c3cdbf">Current Arc Testnet behavior · 100% of each contribution enters the pool.</text>
  </g>
</svg>
